name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch immutable evaluation tags
        run: |
          git fetch --force origin refs/tags/gemastik-g2:refs/tags/gemastik-g2
          git fetch --force origin refs/tags/gemastik-g3:refs/tags/gemastik-g3
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --extra dev
          uv run playwright install --with-deps chromium
      - name: Run complete quality gate
        run: pnpm check:core

  marketing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Check presentation website
        run: pnpm check:marketing

  windows-release-preflight:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install locked Windows release dependencies
        run: uv sync --locked --extra dev --extra desktop
      - name: Check Windows desktop and release surfaces
        run: pnpm check:release
