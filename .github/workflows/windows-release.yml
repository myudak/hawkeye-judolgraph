name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: "1.0.0"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = '${{ inputs.version }}'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Require tagged releases to come from main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tagged releases must point to a commit reachable from origin/main"
          }
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --extra dev --extra desktop
          uv run playwright install chromium
      - name: Run release-specific preflight
        run: |
          pnpm check:web
          pnpm check:release
          git diff --check
      - name: Build frontend and Windows distribution
        shell: pwsh
        run: |
          pnpm build
          choco install innosetup --no-progress -y
          uv run python tools/release/build_windows.py --version '${{ steps.version.outputs.value }}' --skip-browser-install --installer
      - name: Verify frozen application
        run: uv run python tools/release/verify_windows_bundle.py dist/windows/HAWK-EYE/HAWK-EYE.exe
      - name: Verify installer round trip
        shell: pwsh
        run: tools/release/verify_windows_installer.ps1 dist/HAWK-EYE-Setup-${{ steps.version.outputs.value }}-windows-x64.exe
      - name: Verify release checksums
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $expected = @(
            "HAWK-EYE-$version-windows-x64-portable.zip",
            "HAWK-EYE-Setup-$version-windows-x64.exe"
          )
          $entries = @{}
          foreach ($line in Get-Content -LiteralPath dist/SHA256SUMS-windows.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Invalid checksum line: $line"
            }
            $entries[$Matches[2]] = $Matches[1]
          }
          if ($entries.Count -ne $expected.Count) {
            throw "Checksum manifest has $($entries.Count) entries; expected $($expected.Count)"
          }
          foreach ($name in $expected) {
            $path = Join-Path dist $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release asset: $name"
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($entries[$name] -ne $actual) {
              throw "Checksum mismatch: $name"
            }
          }
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/HAWK-EYE-${{ steps.version.outputs.value }}-windows-x64-portable.zip
            dist/HAWK-EYE-Setup-${{ steps.version.outputs.value }}-windows-x64.exe
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HAWK-EYE-${{ steps.version.outputs.value }}-windows-x64
          path: |
            dist/HAWK-EYE-${{ steps.version.outputs.value }}-windows-x64-portable.zip
            dist/HAWK-EYE-Setup-${{ steps.version.outputs.value }}-windows-x64.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(
            'dist/HAWK-EYE-${{ steps.version.outputs.value }}-windows-x64-portable.zip',
            'dist/HAWK-EYE-Setup-${{ steps.version.outputs.value }}-windows-x64.exe',
            'dist/SHA256SUMS-windows.txt'
          )
          gh release create $tag @assets --verify-tag --generate-notes --prerelease --title "HAWK-EYE $tag"
