services:
  hawkeye:
    environment:
      HAWKEYE_LLM_BASE_URL: "https://openrouter.ai/api/v1"
      HAWKEYE_LLM_API_KEY: "${OPENROUTER_APIKEY:?OPENROUTER_APIKEY must be set in .env}"
      HAWKEYE_LLM_MODEL: "${OPENROUTER_MODEL:-openai/gpt-5.6-luna}"
      HAWKEYE_LLM_API_STYLE: "chat_completions"
      HAWKEYE_PUBLIC_DEMO_ORIGIN: "https://hawkeye.myudak.com"
