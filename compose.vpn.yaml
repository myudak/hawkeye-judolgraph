services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.1
    init: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      OPENVPN_CUSTOM_CONFIG: /gluetun/custom.conf
      OPENVPN_USER: "${PROTON_OPENVPN_USER:?PROTON_OPENVPN_USER must be set in .env}"
      OPENVPN_PASSWORD: "${PROTON_OPENVPN_PASSWORD:?PROTON_OPENVPN_PASSWORD must be set in .env}"
      OPENVPN_ENDPOINT_PORT: "${PROTON_OPENVPN_PORT:-51820}"
      DNS_UPSTREAM_RESOLVER_TYPE: "${GLUETUN_DNS_UPSTREAM_RESOLVER_TYPE:-doh}"
      DNS_UPSTREAM_RESOLVERS: "${GLUETUN_DNS_UPSTREAM_RESOLVERS:-cloudflare,google}"
      # Investigations intentionally observe risky public domains. DNS filtering must not silently
      # rewrite that evidence boundary; browser/network safety remains enforced by HAWK-EYE.
      BLOCK_MALICIOUS: "${GLUETUN_BLOCK_MALICIOUS:-off}"
      LOG_LEVEL: "${GLUETUN_LOG_LEVEL:-warn}"
      TZ: "${TZ:-Asia/Jakarta}"
    volumes:
      - "${PROTON_OPENVPN_CONFIG_PATH:-./data/vpn/ca-free-15.protonvpn.udp.ovpn}:/gluetun/custom.conf:ro"
    ports:
      - "127.0.0.1:${HAWKEYE_PORT:-8760}:8760"
    restart: unless-stopped

  hawkeye:
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    extra_hosts: !reset []
    ports: !reset []
