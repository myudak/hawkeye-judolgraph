[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "judolgraph-hawkeye"
version = "1.0.0"
description = "A small, evidence-driven public web collection engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "Pillow>=10.4.0",
  "playwright>=1.50.0",
  "pydantic>=2.8.2",
  "tldextract>=5.1.3",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "ruff>=0.8.0",
  "httpx>=0.28.0",
  "types-beautifulsoup4>=4.12.0.20241020",
]

[tool.setuptools.packages.find]
include = ["hawkeye*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["^tests/"]
