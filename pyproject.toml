[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "judolgraph-hawkeye"
version = "1.0.0"
description = "A small, evidence-driven public web collection engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "Pillow>=10.4.0",
  "playwright==1.62.0",
  "pydantic>=2.8.2",
  "tldextract>=5.1.3",
  "uvicorn>=0.32.0",
]

[project.scripts]
hawkeye = "hawkeye.cli:main"
hawkeye-container = "hawkeye.container:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8.0",
  "httpx>=0.28.0",
  "types-beautifulsoup4>=4.12.0.20241020",
]
desktop = [
  "pyinstaller==6.21.0; sys_platform == 'win32'",
  "pystray==0.19.5; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["apps/api/src"]
include = ["hawkeye*"]

[tool.setuptools.package-data]
hawkeye = [
  "review_app/static/*",
  "review_app/static/chunks/*",
]

[tool.setuptools.data-files]
"share/hawkeye/evaluation" = ["evaluation/fixtures/controlled-interactions-v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["apps/api/src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["^tests/"]
mypy_path = "apps/api/src"

[[tool.mypy.overrides]]
module = ["pystray", "pystray.*"]
ignore_missing_imports = true
